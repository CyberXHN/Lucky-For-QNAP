name: Build Lucky QPKG

on:
  workflow_dispatch:
    inputs:
      version:
        description: '请填写Lucky版本'
        required: true
        default: '3.0.0'
      notes:
        description: '请填写Lucky更新说明'
        required: true
        default: '更新日志：'

jobs:
  pull_and_package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone QDK repository
        run: |
          git clone https://github.com/qnap-dev/QDK.git /tmp/QDK

      - name: Install QDK to Ubuntu
        run: |
          cd /tmp/QDK
          sudo ./InstallToUbuntu.sh install
          echo "/usr/share/QDK/bin" >> $GITHUB_PATH

      - name: Generate QPKG icons from official logo
        run: |
          python3 -m pip install --quiet --user pillow
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36 Edg/156.0.0.0"
          # 先用 curl 默认 UA；官网（阿里云 ESA）边缘偶发 521，失败则带浏览器 UA 重试一次
          if curl -fsSL --retry 3 --connect-timeout 15 -o /tmp/lucky-logo.svg "https://lucky666.cn/img/logo.svg"; then
            echo "logo 下载成功（curl 默认 UA）"
          elif curl -fsSL --retry 3 --connect-timeout 15 -A "$UA" -o /tmp/lucky-logo.svg "https://lucky666.cn/img/logo.svg"; then
            echo "logo 下载成功（浏览器 UA 重试）"
          else
            echo "::warning::Lucky 官网 logo 下载失败（两种 UA 均失败），沿用仓库内置图标"
          fi
          # 仅当文件存在且非空时才生成；生成失败也回退内置图标，构建不中断
          if [ -s /tmp/lucky-logo.svg ] && python3 scripts/gen_icons.py /tmp/lucky-logo.svg "$GITHUB_WORKSPACE/Lucky/icons"; then
            echo "图标生成完成"
          else
            echo "::warning::图标生成失败，沿用仓库内置图标"
          fi

      - name: Build all Lucky QPKG variants
        shell: bash
        env:
          CORE_VERSION: ${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
          QPKG_AUTHOR: ${{ github.repository_owner }}
        run: |
          bash scripts/build_qpkgs.sh

      - name: Create and push tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Lucky QPKG v${{ inputs.version }}
          files: Lucky-build/*
          body: |
            Lucky QPKG ${{ inputs.version }}
            Built with QDK (QNAP Development Kit)
            ## 更新说明：
            ${{ inputs.notes }}
            ## Build Information
            - Version: ${{ inputs.version }}
            - Commit: ${{ github.sha }}
            - Build Date: ${{ github.event.repository.updated_at }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lucky-QPKG-${{ github.run_number }}
          path: Lucky-build/*
          retention-days: 30
